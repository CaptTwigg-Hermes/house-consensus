[project]
name = "house-consensus-ingestion"
version = "0.1.0"
description = "Direct PostgreSQL ingestion worker foundation for House Consensus"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
house-consensus-ingest = "house_consensus_ingestion.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/house_consensus_ingestion"]
