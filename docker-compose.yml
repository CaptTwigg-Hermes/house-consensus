name: house-consensus
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: "Host=${POSTGRES_HOST:-192.168.50.2};Port=${POSTGRES_PORT:-5433};Database=${POSTGRES_DB:-house_consensus};Username=${POSTGRES_USER:-house_consensus};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      INITIAL_OWNER_EMAIL: ${INITIAL_OWNER_EMAIL:?INITIAL_OWNER_EMAIL must be set}
      PublicOrigin: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be set}
      Email__SmtpHost: mailpit
      Email__SmtpPort: "1025"
      AiLearning__BaseUrl: ${AI_LEARNING_BASE_URL:-}
      AiLearning__Model: ${AI_LEARNING_MODEL:-gemma4:12b}
      AiLearning__AllowInsecureHttp: ${AI_LEARNING_ALLOW_INSECURE_HTTP:-false}
      AiLearning__ApiKey: ${AI_LEARNING_API_KEY:-}
      ASPNETCORE_URLS: http://+:8080
    expose: ["8080"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    expose: ["1025", "8025"]
    networks: [internal]
networks: { internal: {} }
