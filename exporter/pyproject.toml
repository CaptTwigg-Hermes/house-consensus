[project]
name = "house-consensus-exporter"
version = "0.1.0"
description = "Idempotent houseshopping to PostgreSQL exporter"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
house-consensus-export = "consensus_exporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consensus_exporter"]
