name: Publish container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-python-release-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: house_consensus_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d house_consensus_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/house_consensus_ci_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Check operational wrapper syntax
        run: sh -n scripts/run-native-ingestion.sh scripts/run-native-manual-scoring.sh
      - name: Test native ingestion and operational wrappers
        run: uv run --project ingestion --extra test pytest -q tests/ingestion
      - name: Test transitional exporter
        run: uv run --project exporter --extra test pytest -q tests/exporter
      - name: Test native manual scoring
        run: uv run --project manual_scoring --extra 'postgres,test' pytest -q manual_scoring/tests

  container-build-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [final, ingestion-worker, manual-scoring-worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native-python-release-gates, container-build-gates]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: final
            latest_tag: latest
            sha_prefix: ""
          - target: ingestion-worker
            latest_tag: ingestion-latest
            sha_prefix: ingestion-
          - target: manual-scoring-worker
            latest_tag: manual-scoring-latest
            sha_prefix: manual-scoring-
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/capttwigg-hermes/house-consensus
          tags: |
            type=raw,value=${{ matrix.latest_tag }}
            type=raw,value=${{ matrix.sha_prefix }}${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
