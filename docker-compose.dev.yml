services:
  app:
    ports: ["127.0.0.1:8080:8080"]
  mailpit:
    ports: ["127.0.0.1:8025:8025"]
  importer:
    profiles: ["tools"]
    build: ./exporter
    environment:
      CONSENSUS_DATABASE_URL: host=${POSTGRES_HOST:-192.168.50.2} port=${POSTGRES_PORT:-5433} dbname=${POSTGRES_DB:-house_consensus} user=${POSTGRES_USER:-house_consensus} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      CONSENSUS_SOURCE_SCOPE: ${CONSENSUS_SOURCE_SCOPE:-greater-copenhagen-v1}
    volumes:
      - ${HOUSESHOPPING_DB:-../houseshopping/state/house.db}:/data/house.db:ro
    command: ["--sqlite", "/data/house.db", "--ensure-schema", "--skip-media"]
    depends_on:
      app: { condition: service_healthy }
    networks: [internal]
