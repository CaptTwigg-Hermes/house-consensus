name: house-consensus

services:
  app:
    image: ghcr.io/capttwigg-hermes/house-consensus:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING must be set}
      INITIAL_OWNER_EMAIL: ${INITIAL_OWNER_EMAIL:?INITIAL_OWNER_EMAIL must be set}
      PublicOrigin: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be set}
      Seq__Url: http://192.168.50.2:5341
      CloudflareAccess__Enabled: "true"
      CloudflareAccess__TeamDomain: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:?CLOUDFLARE_ACCESS_TEAM_DOMAIN must be set}
      CloudflareAccess__Audience: ${CLOUDFLARE_ACCESS_AUDIENCE:?CLOUDFLARE_ACCESS_AUDIENCE must be set}
      AiLearning__BaseUrl: ${AI_LEARNING_BASE_URL:-http://192.168.50.227:11434}
      AiLearning__Model: ${AI_LEARNING_MODEL:-gemma4:12b}
      AiLearning__AllowInsecureHttp: ${AI_LEARNING_ALLOW_INSECURE_HTTP:-true}
      AiLearning__InsecureHttpAllowedHosts: ${AI_LEARNING_INSECURE_HTTP_ALLOWED_HOSTS:-192.168.50.227}
      AiLearning__ApiKey: ${AI_LEARNING_API_KEY:-}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-9000}:8080"
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  native-ingestion:
    image: ghcr.io/capttwigg-hermes/house-consensus:ingestion-latest
    pull_policy: always
    restart: "no"
    profiles: [workers]
    environment: &native-worker-environment
      DATABASE_URL: ${CONSENSUS_DATABASE_URL:?CONSENSUS_DATABASE_URL must be set}
      CONSENSUS_DATABASE_URL: ${CONSENSUS_DATABASE_URL:?CONSENSUS_DATABASE_URL must be set}
      CONSENSUS_NOISE_DATABASE_URL: ${CONSENSUS_NOISE_DATABASE_URL:?CONSENSUS_NOISE_DATABASE_URL must be set}
      CONSENSUS_OLLAMA_HOST: ${CONSENSUS_OLLAMA_HOST:?CONSENSUS_OLLAMA_HOST must be set}
      CONSENSUS_OLLAMA_MODEL: ${CONSENSUS_OLLAMA_MODEL:?CONSENSUS_OLLAMA_MODEL must be set}
      CONSENSUS_COMMUTE_DESTINATIONS: ${CONSENSUS_COMMUTE_DESTINATIONS:?CONSENSUS_COMMUTE_DESTINATIONS must be set}
    command:
      - --boligsiden
      - --execute
      - --source-system
      - house-consensus-ingestion
      - --source-scope
      - tofamiliehus
      - --municipality
      - København
      - --municipality
      - Frederiksberg
      - --municipality
      - Gentofte
      - --municipality
      - Gladsaxe
      - --municipality
      - Hvidovre
      - --municipality
      - Rødovre
      - --municipality
      - Lyngby-Taarbæk
      - --municipality
      - Tårnby
      - --municipality
      - Herlev
      - --municipality
      - Ballerup
      - --municipality
      - Glostrup
      - --municipality
      - Brøndby
      - --municipality
      - Albertslund
      - --municipality
      - Vallensbæk
      - --municipality
      - Dragør
      - --municipality
      - Rudersdal
      - --municipality
      - Furesø
      - --municipality
      - Hørsholm
      - --municipality
      - Egedal
      - --municipality
      - Ishøj
      - --municipality
      - Greve
      - --municipality
      - Høje-Taastrup
      - --municipality
      - Solrød
      - --municipality
      - Roskilde
      - --municipality
      - Køge
      - --municipality
      - Lejre
      - --municipality
      - Allerød
      - --address-type
      - villa
      - --address-type
      - terraced house
      - --address-type
      - double house
      - --address-type
      - multiple family house
      - --address-type
      - farm
      - --price-min
      - "0"
      - --price-max
      - "12000000"
      - --fetch-price-pad
      - "2000000"

  native-manual-scoring:
    image: ghcr.io/capttwigg-hermes/house-consensus:manual-scoring-latest
    pull_policy: always
    restart: "no"
    profiles: [workers]
    environment: *native-worker-environment

networks:
  internal: {}
